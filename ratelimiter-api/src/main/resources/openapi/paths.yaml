rateLimitRule:
  post:
    tags:
      - RateLimit
    operationId: createRateLimitRule
    summary: Create a rate limit rule.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './ratelimiter.yaml#/components/schemas/CreateRateLimitRuleRequest'
    responses:
      '201':
        description: Rate limit rule created.
        content:
          application/json:
            schema:
              $ref: './ratelimiter.yaml#/components/schemas/CreateRateLimitRuleResponse'
      '400':
        description: Invalid request.
  get:
    tags:
      - RateLimit
    operationId: getRateLimitRule
    summary: Get a rate limit rule by service, uri, and method.
    parameters:
      - name: service
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        example: serviceA
      - name: uri
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        example: /some/uri
      - name: method
        in: query
        required: true
        schema:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        example: GET
    responses:
      '200':
        description: Rate limit rule found.
        content:
          application/json:
            schema:
              $ref: './ratelimiter.yaml#/components/schemas/GetRateLimitRuleResponse'
      '404':
        description: Rate limit rule not found.

validateRateLimit:
  get:
    operationId: validateRateLimit
    summary: Validate if a request is allowed.
    parameters:
      - name: service
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        example: serviceA
      - name: uri
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        example: /some/uri
      - name: method
        in: query
        required: true
        schema:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        example: GET
    responses:
      '200':
        description: Validate request.
        content:
          application/json:
            schema:
              $ref: './ratelimiter.yaml#/components/schemas/RateLimitValidateResponse'
      '404':
        description: Rate limit rule not found.

rateLimitRuleById:
  get:
    tags:
      - RateLimit
    operationId: getRateLimitRuleById
    summary: Get a rate limit rule by id.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
        example: 123456
    responses:
      '200':
        description: Rate limit rule found.
        content:
          application/json:
            schema:
              $ref: './ratelimiter.yaml#/components/schemas/GetRateLimitRuleResponse'
      '404':
        description: Rate limit rule not found.
